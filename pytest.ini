[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
markers =
    smoke: smoke suite - core purchase workflow (ordered)
    regression: full regression suite
    checkout: checkout flows
    admin: WordPress admin / SPA flows
    frontend: shop, product, cart flows
    payment: payment gateway flows
    security: security checks
    coupons: coupon discount tests
    critical: critical-path tests
    order: order lifecycle tests
    orders: order management and refunds
    visual: visual regression snapshot tests
    ui_walkthrough: real human interactive UI tests
    performance: high-concurrency multi-user stress testing
